[project]
name = "axonix"
version = "0.1.0"
description = "A neural shell written in Python"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic-settings>=2.12.0",
]
[project.scripts]
ax = "axonix.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
