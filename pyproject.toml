[project]
name = "axonix"
version = "0.9.9-alpha"
description = "A modular Python-based shell focused on extensibility and speed"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [
  { name = "Anton Litvinov" }
]
keywords = ["shell", "terminal", "repl", "prompt-toolkit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Shells",
]
dependencies = [
    "prompt-toolkit>=3.0.52",
    "pydantic-settings>=2.12.0",
]
[project.urls]
Homepage = "https://github.com/daf32/axonix-shell"
Repository = "https://github.com/daf32/axonix-shell"
Changelog = "https://github.com/daf32/axonix-shell/blob/main/CHANGELOG.md"

[project.scripts]
ax = "axonix.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=7.4.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["dist", ".venv"]

[tool.ruff.lint]
# Soft on-ramp: just pyflakes (unused imports, unused variables,
# undefined names). The codebase isn't formatted to a single style
# yet, so import sorting / pycodestyle are intentionally left out for
# now. Ratchet up to ["E", "F", "I", "B"] in a follow-up PR once the
# baseline is clean.
select = ["F"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true
# Loose by default — the codebase isn't fully typed yet. There is a known
# baseline of issues (see PR description); fix them incrementally and
# tighten via `[[tool.mypy.overrides]]` per-module rather than flipping
# strict on globally.
check_untyped_defs = false
warn_unused_ignores = true
