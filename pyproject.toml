[project]
name = "axonix"
version = "0.1.0"
description = "A modular Python-based shell focused on extensibility and speed"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "prompt-toolkit>=3.0.52",
    "pydantic-settings>=2.12.0",
    "pytest>=7.4.0",
]
[project.scripts]
ax = "axonix.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
