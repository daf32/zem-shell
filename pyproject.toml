[project]
name = "axonix"
version = "0.9.9-alpha"
description = "A modular Python-based shell focused on extensibility and speed"
readme = "README.md"
requires-python = ">=3.13"
authors = [
  { name = "Anton Litvinov" }
]
dependencies = [
    "prompt-toolkit>=3.0.52",
    "pydantic-settings>=2.12.0",
]
[project.scripts]
ax = "axonix.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
]
