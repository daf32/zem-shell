[project]
name = "zem"
version = "0.9.11"
description = "A modular Python-based shell focused on extensibility and speed"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Anton Litvinov" }
]
keywords = ["shell", "terminal", "repl", "prompt-toolkit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Shells",
]
dependencies = [
    "prompt-toolkit>=3.0.52",
    "pydantic-settings>=2.12.0",
]
[project.urls]
Homepage = "https://github.com/daf32/zem-shell"
Repository = "https://github.com/daf32/zem-shell"
Changelog = "https://github.com/daf32/zem-shell/blob/main/CHANGELOG.md"

[project.scripts]
zem = "zem.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=7.4.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["dist", ".venv"]

[tool.ruff.lint]
# Soft on-ramp: just pyflakes (unused imports, unused variables,
# undefined names). The codebase isn't formatted to a single style
# yet, so import sorting / pycodestyle are intentionally left out for
# now. Ratchet up to ["E", "F", "I", "B"] in a follow-up PR once the
# baseline is clean.
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# The launcher template embeds a long osascript one-liner in a string.
"scripts/build_mac_app.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
# Loose by default — the codebase isn't fully typed yet. There is a known
# baseline of issues (see PR description); fix them incrementally and
# tighten via `[[tool.mypy.overrides]]` per-module rather than flipping
# strict on globally.
check_untyped_defs = false
warn_unused_ignores = true
