name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check . --output-format github
      - name: Mypy (baseline, non-blocking)
        run: uv run mypy
        continue-on-error: true

      - name: CHANGELOG entries go in Unreleased
        # A branch written before someone else's release, then rebased onto
        # it, lands its entry inside the section that release just closed.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"
          uv run python scripts/check_changelog.py "origin/${{ github.base_ref }}"

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.13"]
        include:
          - os: ubuntu-latest
            python: "3.10"   # oldest supported
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev
      - name: Pytest
        run: uv run pytest -q --junitxml=junit-${{ matrix.os }}-py${{ matrix.python }}.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python }}
          path: junit-${{ matrix.os }}-py${{ matrix.python }}.xml
          retention-days: 7

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - name: Smoke-test the wheel in a clean venv
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/zem --version
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
