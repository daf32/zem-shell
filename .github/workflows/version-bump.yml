name: Version bump

# Runs when a PR is merged into main, and by hand from the Actions tab.
#
# Every merge is recorded: the version is bumped, committed and tagged.
# Not every tag is a release. What the PR's *branch name* decides is
# whether the tag is published:
#
#   minor/...  1.2.3 -> 1.3.0   tag + release (GitHub Release and PyPI)
#   major/...  1.2.3 -> 2.0.0   tag + release, named as a milestone
#   anything else (patch/, ci/, docs/, chore/, dependabot/, ...)
#              1.2.3 -> 1.2.4   tag only: nothing is published
#
# So a tag is "this is what main looked like after that merge", and a
# release is "this is meant for people to install". A published version
# therefore always ends in .0, and the versions in between exist only in
# git, which is fine: nobody looking at PyPI can tell there was a gap.
#
# The CHANGELOG follows the same split. A tag-only bump leaves entries
# under "Unreleased", where they keep accumulating; a release closes that
# section into the new version, so its notes cover everything since the
# previous release.
#
# For a fix that has to ship on its own, run this workflow by hand and
# choose the bump; a hand-run always publishes, patch included.
#
# It bumps [project] version in pyproject.toml, refreshes uv.lock,
# commits that to main, tags vX.Y.Z and -- when publishing -- starts
# release.yml for the tag (a tag pushed with GITHUB_TOKEN does not
# trigger workflows by itself, which is also what keeps the tag-only
# bumps from reaching PyPI).

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      kind:
        description: "Release what is on main now, bumping this part"
        required: true
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write
  actions: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Decide the bump
        id: kind
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          INPUT_KIND: ${{ inputs.kind }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            kind="$INPUT_KIND"
            publish=yes
            echo "asked for by hand -> bump: $kind, publish: $publish"
          else
            case "$HEAD_REF" in
              minor/*) kind=minor; publish=yes ;;
              major/*) kind=major; publish=yes ;;
              *)       kind=patch; publish=no ;;
            esac
            echo "branch '$HEAD_REF' -> bump: $kind, publish: $publish"
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Bump the version and the lock file
        id: bump
        run: |
          uv version --bump "${{ steps.kind.outputs.kind }}" --no-sync
          version="$(uv version --short)"
          uv lock
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Close the CHANGELOG section
        if: steps.kind.outputs.publish == 'yes'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          # Only a release closes it: a tag-only bump leaves the entries
          # under "Unreleased" to go out with the next one.
          python3 - "$VERSION" "$(date -u +%F)" <<'PY'
          import re, sys, pathlib
          version, today = sys.argv[1:3]
          p = pathlib.Path("CHANGELOG.md")
          text = p.read_text()
          new = f"## [Unreleased]\n\n## [{version}] - {today}"
          text, n = re.subn(r"^## \[Unreleased\]\s*$", new, text, count=1, flags=re.M)
          if not n:
              sys.exit("CHANGELOG.md has no '## [Unreleased]' section")
          p.write_text(text)
          PY

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          PUBLISH: ${{ steps.kind.outputs.publish }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$PUBLISH" = "yes" ]; then
            subject="chore(release): v$VERSION"
            message="Release v$VERSION"
          else
            subject="chore(version): v$VERSION"
            message="v$VERSION (tag only, not published)"
          fi
          git add pyproject.toml uv.lock CHANGELOG.md
          git commit -m "$subject"
          git tag -a "v$VERSION" -m "$message"
          git push origin main "v$VERSION"

      - name: Start the release workflow for the tag
        if: steps.kind.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: gh workflow run release.yml --ref "v$VERSION"
